[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "django-crudpack"
version = "0.1.0"
description = "Build the list, create, update, detail and delete views of a Django model from a single class."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Denis Siavichay", email = "dbsiavichay@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["Django>=5.2"]
keywords = ["django", "crud", "views", "generic views"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[project.urls]
Homepage = "https://github.com/dbsiavichay/django-crudpack"
Issues = "https://github.com/dbsiavichay/django-crudpack/issues"
Changelog = "https://github.com/dbsiavichay/django-crudpack/blob/master/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "pytest-cov>=6",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crudpack"]

[tool.hatch.build.targets.sdist]
include = ["src/crudpack", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["crudpack", "tests"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error::DeprecationWarning", "error::PendingDeprecationWarning"]

[tool.coverage.run]
source = ["crudpack"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
build_command = "pip install uv && uv build"
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.changelog]
exclude_commit_patterns = ["^chore\\(release\\)"]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
